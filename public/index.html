        /* ============================================================

        :root {
            /* ユーザー設定からJSで上書きされるUIカラー */
            --ui-base: #001f43;
            --ui-text: #ffffff;

            /* 背景モードの色固定値 */
            --bg-white: #fffff9;
            --bg-black: #1E1E1E;
            --bg-green: #CAFFD0;

            /* 現在のモードに応じた色（初期値は白モード） */
            --bg: var(--bg-white);
            --text: #1E1E1E;
            --link: #001f43;
            --accent: #001f43;
            /* 本文の見出し・枠線 */
            --marker: #ffff99;
            /* マーカー */

            --font-size: 16px;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans JP', sans-serif;
            /* 本文はゴシック体（小サイズでも文字がくっきり読める） */
            font-size: var(--font-size);
            line-height: 2.0;
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
            text-rendering: optimizeLegibility;
        }

        /* 見出しは常に明朝体（文学的な雰囲気を残す） */
        h1,
        h2,
        h3,
        h4,
        h5 {
            font-family: 'Noto Serif JP', serif;
        }

        /* スタイル：明朝体モード（本文のみ切り替わる。見出しは変更されない） */
        body.font-mincho {
            font-family: 'Noto Serif JP', serif;
        }

        /* スタイルボタンの選択状態（ヘッダー色に連動しない固定グレー） */
        .font-btn.active {
            background: #555;
            color: #ffffff;
            border-color: #555;
            font-weight: bold;
        }

        #settings-panel,
        #side-nav,
        #page-top-btn,

            color: var(--ui-base) !important;
            font-weight: bold;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 100px 20px 60px;
            box-sizing: border-box;
        }

        section {
            margin-bottom: 60px;
        }

            width: 100%;

            margin: 20px 0;
            border-radius: 4px;

            height: auto;
            border-radius: 4px;

            top: 0;
            left: 0;

            opacity: 0.9;

        .dice-box>br:last-child,

        const PRERENDERED = {"html":"<h2 id=\"sec-1\">このページについて<\/h2>このページは、TRPGシナリオテンプレート「Set」で作ったサンプルです。<br>テキストの原稿に記号を付けて貼るだけで、このページの形になります。<br><br><ul><li>右上の歯車から、背景色・フォント・文字サイズを切り替えられます<\/li><li>同じく歯車の中で、HOの名前を入力すると、本文の名前がすべて置き換わります<\/li><li>左上の ≡ から目次を開き、読みかけの場所にしおりを挟めます<\/li><li>「コピーする」ボタンで、PLに送る文章をそのままコピーできます<\/li><\/ul><br>「Set」は<a href=\"https://bookshell.booth.pm/\" target=\"_blank\" rel=\"noopener noreferrer\">BOOTH<\/a>で販売しています。<h2 id=\"sec-2\">目次<\/h2><div class=\"main-toc-box\"><a href=\"#sec-1\" class=\"toc-main-2\">このページについて<\/a><a href=\"#sec-2\" class=\"toc-main-2\">目次<\/a><a href=\"#sec-3\" class=\"toc-main-2\">1. 概要<\/a><a href=\"#sec-4\" class=\"toc-main-3\">└ あらすじ<\/a><a href=\"#sec-5\" class=\"toc-main-2\">2. 導入<\/a><a href=\"#sec-6\" class=\"toc-main-3\">└ HOクリエイター<\/a><a href=\"#sec-7\" class=\"toc-main-3\">└ HOプレイヤー<\/a><a href=\"#sec-8\" class=\"toc-main-3\">└ 導入描写<\/a><a href=\"#sec-9\" class=\"toc-main-2\">3. 作業部屋の探索<\/a><a href=\"#sec-10\" class=\"toc-main-3\">└ 机<\/a><a href=\"#sec-11\" class=\"toc-main-3\">└ 本棚<\/a><a href=\"#sec-12\" class=\"toc-main-3\">└ モニター<\/a><a href=\"#sec-13\" class=\"toc-main-2\">4. 締め切り<\/a><a href=\"#sec-14\" class=\"toc-main-2\">5. エンディング<\/a><a href=\"#sec-15\" class=\"toc-main-3\">└ エンド1：公開できた<\/a><a href=\"#sec-16\" class=\"toc-main-3\">└ エンド2：また明日<\/a><a href=\"#sec-17\" class=\"toc-main-2\">後書き<\/a><a href=\"#sec-18\" class=\"toc-main-3\">└ 更新履歴<\/a><\/div><h2 id=\"sec-3\">1. 概要<\/h2>形式：2PL（{HOクリエイター：HOクリエイター}／{HOプレイヤー：HOプレイヤー}）<br>時間目安：1時間程度<br>傾向：シナリオ制作あるある、ほのぼの<br>推奨：シナリオを書いたことがある、または書いてみたい人<h3 id=\"sec-4\">あらすじ<\/h3>シナリオは書き終えた。あとは公開するだけ……のはずだった。<br>改行は崩れ、目次はなく、PLに送る秘匿は手作業でコピーするしかない。<br>締め切りは今夜。二人は、原稿を「読める形」にできるだろうか。<h2 id=\"sec-5\">2. 導入<\/h2><h3 id=\"sec-6\">HOクリエイター<\/h3><div class=\"copy-box\"><div class=\"copy-header\"><span class=\"copy-title\">HOクリエイター 秘匿<\/span><button class=\"copy-btn\" onclick=\"copySnippet(this)\">コピーする<\/button><\/div><div class=\"copy-content\">あなたは、今夜中にシナリオを公開すると約束した。<br>{HOプレイヤー：HOプレイヤー}に、完成版を見せたい。<br><br>原稿は、もう書き終えている。<\/div><\/div><h3 id=\"sec-7\">HOプレイヤー<\/h3><div class=\"copy-box\"><div class=\"copy-header\"><span class=\"copy-title\">HOプレイヤー 秘匿<\/span><button class=\"copy-btn\" onclick=\"copySnippet(this)\">コピーする<\/button><\/div><div class=\"copy-content\">あなたは、{HOクリエイター：HOクリエイター}のシナリオで遊ぶ日を楽しみにしている。<br>ただ、送られてきた原稿は、スマホではとても読みにくかった。<\/div><\/div><h3 id=\"sec-8\">導入描写<\/h3>{HOクリエイター：HOクリエイター}が目を覚ますと、書きかけの原稿に囲まれた作業部屋にいた。<br>モニターには、改行の崩れたシナリオが映っている。<br>隣では{HOプレイヤー：HOプレイヤー}が、スマホの画面を拡大したり縮小したりしている。<div class=\"kp-grey-box\"><strong>【KP情報】<\/strong><br>二人が合流したら、探索に進む。どの場所から調べてもかまわない。<\/div><h2 id=\"sec-9\">3. 作業部屋の探索<\/h2><h3 id=\"sec-10\">机<\/h3><div class=\"dice-box\"><svg class=\"dice-svg\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\" ry=\"2\"><\/rect><circle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"><\/circle><circle cx=\"15.5\" cy=\"15.5\" r=\"1.5\"><\/circle><circle cx=\"15.5\" cy=\"8.5\" r=\"1.5\"><\/circle><circle cx=\"8.5\" cy=\"15.5\" r=\"1.5\"><\/circle><circle cx=\"12\" cy=\"12\" r=\"1.5\"><\/circle><\/svg><span><strong>〈観察〉<\/strong><\/span><br><br><strong class=\"dice-label\">成功：<\/strong><br>机の端に付箋が一枚。「HTMLで配布したい」と、{HOプレイヤー：HOプレイヤー}の字で書かれている。<br><br><strong class=\"dice-label\">失敗：<\/strong><br>積み上がった資料が、今にも崩れそうだ。<div class=\"dice-child\"><svg class=\"dice-svg\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\" ry=\"2\"><\/rect><circle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"><\/circle><circle cx=\"15.5\" cy=\"15.5\" r=\"1.5\"><\/circle><circle cx=\"15.5\" cy=\"8.5\" r=\"1.5\"><\/circle><circle cx=\"8.5\" cy=\"15.5\" r=\"1.5\"><\/circle><circle cx=\"12\" cy=\"12\" r=\"1.5\"><\/circle><\/svg><span><strong>〈知識〉<\/strong><\/span><br><strong class=\"dice-label\">成功：<\/strong><br>記号を付けて貼るだけで、原稿が整う方法を思い出す。<\/div><\/div><h3 id=\"sec-11\">本棚<\/h3>本棚の一番上に、古いメモが挟まっている。<br><br><div class=\"quote-box\">締め切り前の自分へ<br>原稿を書き終えたら、それで終わりだと思っていないか。<br>読む人が迷わない形にするまでが、シナリオだ。<\/div><h3 id=\"sec-12\">モニター<\/h3>モニターには、公開までに残った作業が並んでいる。<br><br><ol><li>見出しを付けて、目次を作る<\/li><li>判定の場面を、枠で囲む<\/li><li>PLに送る文章を、コピーしやすくする<\/li><li>スマホでも読めるか確かめる<\/li><\/ol><div class=\"kp-grey-box\"><strong>【KP情報】<\/strong><br>三つの場所をすべて調べたら、<a href=\"#sec-13\">4. 締め切り<\/a>に進む。<\/div><h2 id=\"sec-13\">4. 締め切り<\/h2>時計の針は、23時を回った。<br>{HOクリエイター：HOクリエイター}は、原稿に記号を付けていく。<div class=\"dice-box\"><svg class=\"dice-svg\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\" ry=\"2\"><\/rect><circle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"><\/circle><circle cx=\"15.5\" cy=\"15.5\" r=\"1.5\"><\/circle><circle cx=\"15.5\" cy=\"8.5\" r=\"1.5\"><\/circle><circle cx=\"8.5\" cy=\"15.5\" r=\"1.5\"><\/circle><circle cx=\"12\" cy=\"12\" r=\"1.5\"><\/circle><\/svg><span><strong>〈集中〉<\/strong><\/span><br><br><strong class=\"dice-label\">成功：<\/strong><br>すべての記号を付け終える。ブラウザで開くと、原稿がきれいに並んでいた。<br><br><strong class=\"dice-label\">失敗：<\/strong><br>最後の一行で手が止まる。それでも、締め切りには間に合いそうだ。<\/div><div class=\"copy-box\"><div class=\"copy-header\"><span class=\"copy-title\">描写<\/span><button class=\"copy-btn\" onclick=\"copySnippet(this)\">コピーする<\/button><\/div><div class=\"copy-content\">画面の中で、崩れていた原稿が、読みやすいページに変わっていく。<br>見出しが並び、判定は枠に収まり、秘匿はボタン一つでコピーできる。<\/div><\/div><h2 id=\"sec-14\">5. エンディング<\/h2><h3 id=\"sec-15\">エンド1：公開できた<\/h3>{HOプレイヤー：HOプレイヤー}のスマホに、完成したシナリオが届く。<br>「読みやすい」と、短い返事が来た。<h3 id=\"sec-16\">エンド2：また明日<\/h3>締め切りには間に合わなかった。<br>けれど、原稿はもう半分まで整っている。明日には、きっと届けられる。<br><br><hr><h2 id=\"sec-17\">後書き<\/h2>最後まで読んでいただき、ありがとうございます。<br>このページと同じ形のシナリオを、テキストの原稿から作れます。<br>くわしくは<a href=\"https://bookshell.booth.pm/\" target=\"_blank\" rel=\"noopener noreferrer\">BOOTHの商品ページ<\/a>をご覧ください。<h3 id=\"sec-18\">更新履歴<\/h3><table class=\"history-table\">\n                                <thead>\n                                    <tr>\n                                        <th>更新日<\/th>\n                                        <th>バージョン<\/th>\n                                        <th>更新内容<\/th>\n         function showErrorBanner(message) {
            document.body.insertAdjacentHTML('afterbegin', `
                <div style="background-color: #ffe6e6; color: #cc0000; padding: 15px; text-align: center; font-weight: bold; border-bottom: 2px solid #cc0000; z-index: 9999; position: relative; font-size: 14px;">
                    ${message}
                </div>
            `);
        }

        // 文字があれば表示し、空なら要素ごと隠す
        function setTextOrHide(id, text) {
            const el = document.getElementById(id);
            if (text) {
                el.textContent = text;
                el.style.display = '';
            } else {
                el.style.display = 'none';
            }
        }

        // IDが空欄・初期値のままなら、タイトルと作者名から自動で作る（他のシナリオと保存データが混ざらないように）
        const DEFAULT_SCENARIO_IDS = ['', 'zirconia_praise_001'];
        function resolveScenarioId(config) {
            if (!config) return 'default_scenario_id';
            const id = String(config.id || '').trim();
            if (!DEFAULT_SCENARIO_IDS.includes(id)) return id;
            const source = String(config.title || '') + '\u0000' + String(config.author || '');
            // FNV-1a（32bit）で短い英数字にする
            let hash = 0x811c9dc5;
            for (let i = 0; i < source.length; i++) {
                hash ^= source.charCodeAt(i);
                hash = Math.imul(hash, 0x01000193) >>> 0;
            }
            return 'auto_' + hash.toString(36);
        }

        function initScenario() {
            try {
                const scenarioId = resolveScenarioId(typeof SCENARIO_CONFIG !== 'undefined' ? SCENARIO_CONFIG : null);
                const storagePrefix = 'zirconia_' + scenarioId + '_';


                // Step 4: 変数の流し込み
                if (typeof SCENARIO_CONFIG !== 'undefined') {
                    if (SCENARIO_CONFIG.uiBaseColor) {
                        document.documentElement.style.setProperty('--ui-base', SCENARIO_CONFIG.uiBaseColor);

                        // --- ファビコン（タブのアイコン）のカラー同期処理 ---
                        let encodedColor = SCENARIO_CONFIG.uiBaseColor.replace('#', '%23'); // #をURL用に変換
                        let svgData = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' stroke='${encodedColor}' fill='none' stroke-width='2'%3E%3Cg transform='translate(1.8, 5.0) scale(0.85)'%3E%3Crect x='3' y='3' width='18' height='18' rx='2' ry='2'/%3E%3Ccircle cx='8.5' cy='8.5' r='1.5' fill='${encodedColor}' stroke='none'/%3E%3Ccircle cx='15.5' cy='15.5' r='1.5' fill='${encodedColor}' stroke='none'/%3E%3Ccircle cx='15.5' cy='8.5' r='1.5' fill='${encodedColor}' stroke='none'/%3E%3Ccircle cx='8.5' cy='15.5' r='1.5' fill='${encodedColor}' stroke='none'/%3E%3Ccircle cx='12' cy='12' r='1.5' fill='${encodedColor}' stroke='none'/%3E%3C/g%3E%3C/svg%3E`;
                        let faviconLink = document.createElement('link');
                        faviconLink.rel = 'icon';
                        faviconLink.type = 'image/svg+xml';
                        faviconLink.href = svgData;
                        document.head.appendChild(faviconLink);
                    }
                    if (SCENARIO_CONFIG.uiTextColor) {
                        document.documentElement.style.setProperty('--ui-text', SCENARIO_CONFIG.uiTextColor);
                    }

                    document.title = SCENARIO_CONFIG.title + "｜" + SCENARIO_CONFIG.author;
                    document.querySelector('.header-title').textContent = SCENARIO_CONFIG.title;
                    document.getElementById('ScenarioTitle').textContent = SCENARIO_CONFIG.title;

                    // タイトルの近くにバージョン番号を表示（改修①）
                    setTextOrHide('sys-version', SCENARIO_CONFIG.version);

                    setTextOrHide('sys-catch-copy', SCENARIO_CONFIG.catchCopy);
                    setTextOrHide('sys-sub-copy', SCENARIO_CONFIG.subCatchCopy);

                    const trailerImg = document.getElementById('sys-trailer-img');
                    if (SCENARIO_CONFIG.trailerImg) {
                        trailerImg.setAttribute('src', SCENARIO_CONFIG.trailerImg);
                    } else {
                        trailerImg.style.display = 'none';
                    }

                    const disclaimer = document.getElementById('sys-disclaimer');
                    if (SCENARIO_CONFIG.disclaimer) {
                        disclaimer.innerHTML = SCENARIO_CONFIG.disclaimer.replace(/\n/g, '<br>');
                    } else {
                        disclaimer.style.display = 'none';
                    }

                    // フッターの構築
                    let creditsHtml = `<div class="scenario-footer">
                        <div class="credit-list">`;

                    // 固定クレジット項目を追加
                    creditsHtml += `<div class="credit-item"><span>シナリオタイトル</span><span>${SCENARIO_CONFIG.title}</span></div>`;
                    if (SCENARIO_CONFIG.version) {
                        creditsHtml += `<div class="credit-item"><span>バージョン番号</span><span>${SCENARIO_CONFIG.version}</span></div>`;
                    }
                    if (SCENARIO_CONFIG.updateDate) {
                        creditsHtml += `<div class="credit-item"><span>更新日</span><span>${SCENARIO_CONFIG.updateDate}</span></div>`;
                    }
                    creditsHtml += `<div class="credit-item"><span>作者名</span><span>${SCENARIO_CONFIG.author}</span></div>`;

                    if (SCENARIO_CONFIG.credits && SCENARIO_CONFIG.credits.length > 0) {
                        SCENARIO_CONFIG.credits.forEach(c => {
                            creditsHtml += `<div class="credit-item"><span>${c.name}</span><a href="${c.url}" target="_blank">${c.label}</a></div>`;
                        });
                    }
                    creditsHtml += `</div>
                        <div class="copyright">&copy; ${SCENARIO_CONFIG.author} All Rights Reserved.</div>
                    </div>
                    <div class="system-footer">
                        TRPGシナリオテンプレート「Set」 by <a href="${SYSTEM_CREDIT_URL}" target="_blank">ジルコニア賛美</a>
                    </div>`;
                    document.querySelector('footer').innerHTML = creditsHtml;
                } else {
                    showErrorBanner(`【エラー】設定エリア（SCENARIO_CONFIG）の読み込みに失敗しました。<br>
                        「,（カンマ）」や「\`（バッククォート）」が消えていないか確認してください。`);
                }

                let rawHtml = document.getElementById('ScenarioSource').innerHTML;
                if (rawHtml) {
                    let parsed = ScenarioParser.parse(rawHtml);
                    document.getElementById('ScenarioContent').innerHTML = parsed.html;
                    document.getElementById('side-toc-container').innerHTML = parsed.sideToc;
                }

                initializeScanner('#ScenarioContent, #side-toc-container', '#dynamic-inputs-container', storagePrefix);

                const settingsPanel = document.getElementById('settings-panel');
                const sideNav = document.getElementById('side-nav');

                document.getElementById('settings-trigger').addEventListener('click', function () {
                    settingsPanel.classList.toggle('open');
                    sideNav.classList.remove('open');
                });
                document.getElementById('menu-trigger').addEventListener('click', function () {
                    sideNav.classList.add('open');
                    settingsPanel.classList.remove('open');
                });
                document.querySelectorAll('#nav-close, #side-nav a').forEach(el => {
                    el.addEventListener('click', function () { sideNav.classList.remove('open'); });
                });

                // パネルの外をクリックしたら閉じる（歯車アイコンの線を押した場合も「外」と判定しない）
                document.addEventListener('mouseup', function (e) {
                    if (!e.target.closest('#settings-panel, #settings-trigger')) {
                        settingsPanel.classList.remove('open');
                    }
                });

                // しおりは「直前の見出し」と「次の見出しまでの進み具合（0〜1）」で保存する。
                // 文字サイズ・フォント・画面幅が変わっても、同じ場所に戻れるようにするため。
                const BOOKMARK_OFFSET = 85; // 固定ヘッダーの高さ（見出しのscroll-margin-topと同じ）
                function getBookmarkHeadings() {
                    return Array.from(document.querySelectorAll('main h1, main h2, main h3, main h4, main h5'));
                }
                function absTop(el) {
                    return el.getBoundingClientRect().top + window.scrollY;
                }
                window.saveBookmark = function () {
                    const list = getBookmarkHeadings();
                    const point = window.scrollY + BOOKMARK_OFFSET;
                    let index = -1;
                    list.forEach((h, i) => { if (absTop(h) <= point) index = i; });
                    const start = index >= 0 ? absTop(list[index]) : 0;
                    const end = index + 1 < list.length ? absTop(list[index + 1]) : document.documentElement.scrollHeight;
                    const ratio = end > start ? Math.min(Math.max((point - start) / (end - start), 0), 1) : 0;
                    const data = {
                        i: index,
                        t: index >= 0 ? list[index].textContent.trim() : '',
                        r: Math.round(ratio * 1000) / 1000
                    };
                    if (safeSet(storagePrefix + 'bookmark', JSON.stringify(data))) {
                        alert("しおりを挟みました。");
                    } else {
                        alert("このブラウザの設定では、しおりを保存できません。");
                    }
                };
                function bookmarkTop(saved) {
                    // 古い形式（ピクセル位置の数値）のしおり
                    if (/^\d+(\.\d+)?$/.test(saved)) return parseFloat(saved);
                    let data;
                    try { data = JSON.parse(saved); } catch (e) { return null; }
                    if (!data || typeof data.i !== 'number') return null;
                    const list = getBookmarkHeadings();
                    let index = -1;
                    if (data.i >= 0) {
                        // 同じ文字の見出しを探す（同名が複数あれば、保存時の順番に近いもの）。見つからなければ順番で探す
                        list.forEach((h, i) => {
                            if (h.textContent.trim() === data.t && (index < 0 || Math.abs(i - data.i) < Math.abs(index - data.i))) index = i;
                        });
                        if (index < 0) index = Math.min(data.i, list.length - 1);
                    }
                    const start = index >= 0 ? absTop(list[index]) : 0;
                    const end = index + 1 < list.length ? absTop(list[index + 1]) : document.documentElement.scrollHeight;
                    const ratio = Math.min(Math.max(Number(data.r) || 0, 0), 1);
                    return Math.max(start + (end - start) * ratio - BOOKMARK_OFFSET, 0);
                }
                function loadBookmark() {
                    const saved = safeGet(storagePrefix + 'bookmark');
                    if (!saved) return;
                    const restore = () => setTimeout(() => {
                        const top = bookmarkTop(saved);
                        if (top !== null) window.scrollTo({ top: top, behavior: 'smooth' });
                    }, 100);
                    // 画像とフォントの読み込みが終わってから位置を計算する
                    const afterFonts = () => (document.fonts && document.fonts.ready ? document.fonts.ready.then(restore, restore) : restore());
                    if (document.readyState === 'complete') afterFonts();
                    else window.addEventListener('load', afterFonts);
                }

                loadBookmark();
                loadTheme();
                loadFontSize();
                loadFontStyle();

                const pageTopBtn = document.getElementById('page-top-btn');
                const headings = document.querySelectorAll('main h1, main h2, main h3, main h4, main h5');
                const sideTocLinks = document.querySelectorAll('#side-toc-container a');

                let scrollTimeout;
                window.addEventListener('scroll', function () {
                    pageTopBtn.classList.toggle('show', window.scrollY > 300);

                    if (scrollTimeout) { clearTimeout(scrollTimeout); }
                    scrollTimeout = setTimeout(function () {
                        let scrollPos = window.scrollY + 120;
                        let currentId = "";

                        headings.forEach(h => {
                            if (h.getBoundingClientRect().top + window.scrollY <= scrollPos) {
                                currentId = h.id;
                            }
                        });

                        if (currentId) {
                            sideTocLinks.forEach(a => {
                                a.classList.toggle('active', a.getAttribute('href') === '#' + currentId);
                            });
                        }
                    }, 50);
                });

                pageTopBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });

                const lightbox = document.getElementById('lightbox-overlay');
                const lightboxImg = document.getElementById('lightbox-img');

                document.querySelectorAll('main img').forEach(img => {
                    img.addEventListener('click', function () {
                        const src = this.getAttribute('src');
                        if (src) {
                            lightboxImg.setAttribute('src', src);
                            lightbox.classList.add('show');
                        }
                    });
                });

                function closeLightbox() {
                    lightbox.classList.remove('show');
                    setTimeout(() => {
                        if (!lightbox.classList.contains('show')) {
                            lightboxImg.setAttribute('src', '');
                        }
                    }, 300);
                }
                lightbox.addEventListener('click', closeLightbox);
                // Escキーでも閉じる
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape' && lightbox.classList.contains('show')) closeLightbox();
                });
            } catch (err) {
                console.error(err);
                showErrorBanner(`【エラー】表示の途中で問題が発生しました。<br>
                    直前に編集した箇所に記号の抜けや書き間違いがないか確認してください。`);
            } finally {
                // 途中で失敗しても、画面が真っ白のままにならないようにする
                document.body.style.opacity = "1";
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initScenario);
        } else {
            initScenario();
        }

        function toPlainTitle(text) {
            return text
                .replace(/｜([^《]+?)《([^》]+?)》/g, '$1')
                .replace(/\*\*(.*?)\*\*/g, '$1')
                .replace(/==(.*?)==/g, '$1');
        }

        function formatKeywords(text) {
            let t = text.replace(/(成功[：:]|失敗[：:])/g, '<strong class="dice-label">$1</strong>');
            t = t.replace(/(〈[^〉]+〉)/g, '<strong>$1</strong>');
            t = t.replace(/――/g, '<span class="dash-conn">――</span>');
            return t;
        }

        // containerSelectorはカンマ区切りで複数指定できる（本文とサイドメニューの目次など）
        function initializeScanner(containerSelector, panelSelector, storagePrefix) {
            const containers = document.querySelectorAll(containerSelector);
            const panel = document.querySelector(panelSelector);
            if (containers.length === 0 || !panel) return;

            const foundTags = new Map();
            const TAG_REGEX = /\{([^}：:]+)(?:[：:]([^}]+))?\}/g;

            containers.forEach(container => {
                container.innerHTML = container.innerHTML.replace(TAG_REGEX, (match, id, label) => {
                    const displayLabel = label || id;
                    foundTags.set(id, displayLabel);
                    return `<span data-id="${id}" class="replaceable-text" title="${displayLabel}を入力">${displayLabel}</span>`;
                });
            });

            if (foundTags.size === 0) {
                panel.innerHTML = '<div style="font-size:11px; color:#999;">置換タグが見つかりませんでした</div>';
                return;
            }

            const priorityList = ['PC', 'KPC', 'HO1', 'HO2', 'HO3', 'HO4'];

            const sortedTags = Array.from(foundTags.entries()).sort((a, b) => {
                let indexA = priorityList.indexOf(a[0]);
                let indexB = priorityList.indexOf(b[0]);
                if (indexA === -1) indexA = 9999;
                if (indexB === -1) indexB = 9999;

                if (indexA !== indexB) {
                    return indexA - indexB;
                } else {
                    return 0;
                }
            });

            sortedTags.forEach(([id, label]) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'input-group';
                const labelEl = document.createElement('label');
                labelEl.textContent = label;
                labelEl.title = label;
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = `${label}`;

                const savedValue = safeGet(storagePrefix + 'text_' + id);
                if (savedValue) {
                    input.value = savedValue;
                    setTimeout(() => updateText(id, savedValue), 0);
                }

                input.addEventListener('input', (e) => {
                    const newValue = e.target.value;
                    const displayText = newValue || label;
                    updateText(id, displayText);
                    if (newValue) safeSet(storagePrefix + 'text_' + id, newValue);
                    else safeRemove(storagePrefix + 'text_' + id);
                });

                wrapper.appendChild(labelEl);
                wrapper.appendChild(input);
                panel.appendChild(wrapper);
            });
        }

        function updateText(id, value) {
            const targets = document.querySelectorAll(`span[data-id="${id}"]`);
            targets.forEach(el => el.textContent = value);
        }

        function resetNames() {
            const inputs = document.querySelectorAll('#dynamic-inputs-container input');
            inputs.forEach(input => {
                input.value = '';
                input.dispatchEvent(new Event('input'));
            });
            alert("変換を初期化しました。");
        }

        function setTheme(mode) {
            const root = document.documentElement;
            if (mode === 'white') {
                root.style.setProperty('--bg', 'var(--bg-white)');
                root.style.setProperty('--text', '#1E1E1E');
                root.style.setProperty('--link', '#001f43');
                root.style.setProperty('--accent', '#001f43'); // ダークブルー
                root.style.setProperty('--marker', '#ffff99'); // 優しい黄色
            } else if (mode === 'dark') {
                root.style.setProperty('--bg', 'var(--bg-black)');
                root.style.setProperty('--text', '#fffff9');
                root.style.setProperty('--link', '#4da6ff'); // 紫がからない明るいブルー
                root.style.setProperty('--accent', '#b0c4de'); // 明るいシルバーブルー
                root.style.setProperty('--marker', '#ff8c00'); // ディープオレンジ
            } else if (mode === 'green') {
                root.style.setProperty('--bg', 'var(--bg-green)');
                root.style.setProperty('--text', '#1E1E1E');
                root.style.setProperty('--link', '#001f43');
                root.style.setProperty('--accent', '#001f43'); // ダークブルー
                root.style.setProperty('--marker', '#ffcc80'); // マイルドなオレンジ
            }
            safeSet('zirconia_theme', mode);
        }

        function loadTheme() { const savedTheme = safeGet('zirconia_theme'); if (savedTheme) setTheme(savedTheme); }
        function setFontSize(size) {
            document.documentElement.style.setProperty('--font-size', size);
            safeSet('zirconia_font_size', size);
            // フォントサイズボタンの選択状態を更新
            const sizeMap = { '14px': '.size-s', '16px': '.size-m', '20px': '.size-l' };
            document.querySelectorAll('.size-s, .size-m, .size-l').forEach(btn => btn.classList.remove('active'));
            if (sizeMap[size]) document.querySelector(sizeMap[size]).classList.add('active');
        }
        function loadFontSize() { const savedSize = safeGet('zirconia_font_size'); if (savedSize) setFontSize(savedSize); }
        function setFontStyle(style) {
            const isMincho = style === 'mincho';
            document.body.classList.toggle('font-mincho', isMincho);
            document.getElementById('style-btn-mincho').classList.toggle('active', isMincho);
            document.getElementById('style-btn-gothic').classList.toggle('active', !isMincho);
            safeSet('zirconia_font_style', style);
        }
        function loadFontStyle() { const saved = safeGet('zirconia_font_style'); setFontStyle(saved || 'gothic'); }

        function copySnippet(btn) {
            const textToCopy = btn.closest(".copy-box").querySelector(".copy-content").innerText.trim();
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(() => { showCopySuccess(btn); }).catch(() => { fallbackCopy(textToCopy, btn); });
            } else { fallbackCopy(textToCopy, btn); }
        }

        function fallbackCopy(text, btn) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed"; textArea.style.top = "0"; textArea.style.left = "0"; textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.select(); textArea.setSelectionRange(0, 99999);
            try { document.execCommand('copy'); showCopySuccess(btn); } catch (err) { alert("コピー機能がブロックされています。"); }
            document.body.removeChild(textArea);
        }

        function showCopySuccess(btn) {
            const oldText = btn.textContent; btn.textContent = "完了！";
            btn.style.background = "#fff"; btn.style.color = "var(--accent)";
            setTimeout(() => { btn.textContent = oldText; btn.style.background = "var(--bg)"; btn.style.color = "var(--accent)"; }, 1500);
        }
    </script>
